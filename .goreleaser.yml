version: 2

builds:
  - binary: midaz
    dir: .
    main: ./cmd/midaz/
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/SparkssL/Midaz-cli/internal/build.Version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "midaz-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  disable: true
